[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "renkin"
version = "0.30.0"
description = "Ultra-fast retrosynthesis engine for computer-aided synthesis planning (CASP) — pure Rust, Python bindings via PyO3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["retrosynthesis", "cheminformatics", "chemistry", "drug-discovery", "casp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
# Declared interval: >=0.7.2,<=0.8.0 -- the two endpoints, and only the
# two endpoints, individually verified against real PyPI artifacts (see
# docs/design/syntheseus-0.8-compatibility-spike.md). Deliberately NOT
# <0.9 or unpinned: an unverified future 0.8.1/0.9.0 must not be silently
# accepted just because it would likely still work -- verified and
# supported are not the same claim.
syntheseus = ["syntheseus>=0.7.2,<=0.8.0"]

[project.urls]
Homepage   = "https://github.com/kent-tokyo/renkin"
Repository = "https://github.com/kent-tokyo/renkin"
Issues     = "https://github.com/kent-tokyo/renkin/issues"

[tool.maturin]
features      = ["python"]
module-name   = "renkin"
python-source = "python"
