[package]
name = "renkin-forward"
version = "0.2.0"
edition = "2024"
description = "Template-based forward reaction prediction — renkin workspace"
repository = "https://github.com/kent-tokyo/renkin"
license = "MIT"
readme = "README.md"

[[bin]]
name = "renkin-forward"
path = "src/main.rs"

[dependencies]
renkin      = { path = "../.." }
chematic    = { version = "0.6", features = ["smiles", "chem", "smarts", "rxn"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
sha2        = "0.10"
