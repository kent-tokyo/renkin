[package]
name = "renkin-forward"
version = "0.2.0"
edition = "2024"
description = "Template-based forward reaction prediction — renkin workspace"
repository = "https://github.com/kent-tokyo/renkin"
license = "MIT"
readme = "README.md"

[[bin]]
name = "renkin-forward"
path = "src/main.rs"

[dependencies]
renkin      = { path = "../.." }
# Must match the root crate's chematic source exactly (see root Cargo.toml) --
# renkin-forward exchanges chematic::Molecule values with renkin across the
# crate boundary, so a mismatched source would be a different, incompatible type.
chematic    = { version = "0.9", features = ["smiles", "chem", "smarts", "rxn"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
sha2        = "0.11"
# Matches the version already used by the root `renkin` crate -- needed to
# name `chematic_smarts::find_matches_with_config`'s own return type
# (`Vec<FxHashMap<usize, AtomIdx>>`) explicitly in `hints.rs`.
rustc-hash  = "2"
