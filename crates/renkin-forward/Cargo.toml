[package]
name = "renkin-forward"
version = "0.2.0"
edition = "2024"
description = "Template-based forward reaction prediction — renkin workspace"
repository = "https://github.com/kent-tokyo/renkin"
license = "MIT"
readme = "README.md"

[[bin]]
name = "renkin-forward"
path = "src/main.rs"

[dependencies]
renkin      = { path = "../.." }
# Must match the root crate's chematic source exactly (git dep, see root Cargo.toml
# for why) -- renkin-forward exchanges chematic::Molecule values with renkin across
# the crate boundary, so a mismatched source would be a different, incompatible type.
chematic    = { git = "https://github.com/kent-tokyo/chematic.git", rev = "97c87e36951ae4b316bb893d434292f41ba65968", features = ["smiles", "chem", "smarts", "rxn"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
sha2        = "0.10"
