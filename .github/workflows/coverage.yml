name: Rust coverage

# Path-skipped workflows remain pending if configured as required checks.
# Replace this filter with a job-level skip before requiring rust-coverage.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CITATION.cff'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CITATION.cff'
  workflow_dispatch:

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Test the native Rust workspace and produce LCOV
        run: cargo llvm-cov --workspace --lib --bins --tests --lcov --output-path target/lcov.info --fail-under-lines 90 -- --quiet
      - name: Enforce 90% on the report uploaded to Codecov
        run: |
          awk -F: '
            /^LF:/ { total += $2 }
            /^LH:/ { hit += $2 }
            END {
              if (total == 0) { print "Empty LCOV report"; exit 1 }
              printf "LCOV line coverage: %d/%d (%.2f%%)\n", hit, total, 100 * hit / total
              if (hit * 100 < total * 90) exit 1
            }
          ' target/lcov.info
      - name: Upload Rust coverage to Codecov
        # Fork PRs still run the 90% gate, but cannot request an OIDC token.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          files: ./target/lcov.info
          disable_search: true
          flags: rust
          use_oidc: true
          fail_ci_if_error: true
