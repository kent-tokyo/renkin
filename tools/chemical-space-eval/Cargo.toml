# Standalone tool for the Chemical Space Coverage Diagnosis PoC. Deliberately
# its own nested [workspace] (not a member of the root renkin Cargo.toml) --
# see data/chemical_space_coverage_diagnosis/findings.md for why: RENKIN
# core stays completely untouched by this diagnostic effort, matching the
# existing chematic/RENKIN/Yomitoki JSON-boundary architecture.
[workspace]

[package]
name = "chemical-space-eval"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "nearest-train-tanimoto"
path = "src/main.rs"

[dependencies]
chematic = { version = "0.11", features = ["smiles", "fp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
